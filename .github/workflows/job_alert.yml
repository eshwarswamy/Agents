name: Daily Job Alert

on:
  schedule:
    - cron: '30 1 * * *'   # 7:00 AM IST (UTC+5:30 = 01:30 UTC)
  workflow_dispatch:         # Manual trigger from GitHub UI

jobs:
  job-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job alert agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOBS_BOT_TOKEN: ${{ secrets.JOBS_BOT_TOKEN }}
          JOBS_CHAT_ID:   ${{ secrets.JOBS_CHAT_ID }}
        run: python job_alert_agent.py
